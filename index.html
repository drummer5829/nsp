<style>
:root {
  --navy: #0d2c54;
  --navy-mid: #1e4fa1;
  --navy-light: #2d6bb5;
  --bg: #f0f4fa;
  --card: #ffffff;
  --text: #1a2a3a;
  --subtext: #5a6a7a;

  --below-bg: #ffe0d0;
  --below-bar: #e05a2b;
  --low-bg: #fffbe0;
  --low-bar: #c8a800;
  --medium-bg: #d8f5d8;
  --medium-bar: #2e9e4f;
  --high-bg: #eaf7c0;
  --high-bar: #7db500;
  --above-bg: #ffd8d8;
  --above-bar: #d63b3b;
  --nodata-bg: #f7f9fc;
  --nodata-bar: #b0bec5;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Barlow', sans-serif;
  background: var(--bg);
  color: var(--text);
}

/* ── HEADER ── */
header {
  background: linear-gradient(135deg, #081d38 0%, #0d2c54 50%, #163d70 100%);
  color: white;
  padding: 12px 20px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
header::before {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    -45deg,
    rgba(255,255,255,0.02) 0px,
    rgba(255,255,255,0.02) 1px,
    transparent 1px,
    transparent 12px
  );
}
header h1 {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  position: relative;
}

/* ── STICKY TOP ── */
.sticky-top {
  position: sticky;
  top: 0;
  z-index: 2000;
  background: var(--bg);
  box-shadow: 0 2px 10px rgba(13,44,84,0.12);
}
.sticky-top .meta-bar { margin-bottom: 8px; }

.cond-filter { position: relative; }
.cond-filter button {
  font-family: 'Barlow', sans-serif; font-size: 0.82rem; font-weight: 600;
  color: var(--navy); background: white; border: none; padding: 6px 12px;
  border-radius: 20px; box-shadow: 0 1px 6px rgba(13,44,84,0.12); cursor: pointer;
}
.cond-panel {
  display: none; position: absolute; top: 110%; left: 0; z-index: 1200;
  background: white; border-radius: 10px; padding: 8px 12px;
  box-shadow: 0 6px 20px rgba(13,44,84,0.2); min-width: 130px;
}
.cond-panel.open { display: block; }
.cond-panel label {
  display: flex; align-items: center; gap: 7px; padding: 4px 0;
  font-size: 0.83rem; color: var(--text); cursor: pointer; white-space: nowrap;
}
.cond-panel input { accent-color: var(--medium-bar); cursor: pointer; }

.filters {
  display: flex;
  gap: 8px;
  flex-wrap: nowrap;
  margin-left: auto;
  justify-content: flex-end;
  align-items: center;
}
#clearFilters { background: var(--navy); color: white; }
.filters select, .cond-filter button, #filtersToggle, .rain-badge, #clearFilters, #favOnlyBtn {
  font-family: 'Barlow', sans-serif;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--navy);
  background: white;
  border: none;
  padding: 6px 10px;
  border-radius: 20px;
  box-shadow: 0 1px 6px rgba(13,44,84,0.12);
  cursor: pointer;
  white-space: nowrap;
  width: fit-content;
}
#filtersToggle { display: none; }  /* desktop: inline filters, no toggle */
#searchIconBtn { display: none; }  /* mobile only */

.search-wrap { position: relative; display: inline-flex; align-items: center; }
#searchBox {
  font-family: 'Barlow', sans-serif;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--navy);
  background: white;
  border: none;
  padding: 6px 26px 6px 12px;
  border-radius: 20px;
  box-shadow: 0 1px 6px rgba(13,44,84,0.12);
  width: 150px;
}
#searchBox::placeholder { color: var(--subtext); font-weight: 400; }
#searchClearBtn {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  background: none; border: none; color: var(--subtext); font-size: 1rem;
  cursor: pointer; line-height: 1; padding: 2px;
}
#filtersToggle.active { background: var(--navy); color: white; }
#searchIconBtn.active { background: var(--navy); color: white; }
#favOnlyBtn.active { background: #d63b6f; color: white; }
.flt-arrow {
  display: inline-block;
  transition: transform 0.15s ease;
}
#filtersToggle.active .flt-arrow { transform: rotate(180deg); }
.legend {
  width: 100%;
  justify-content: center;
  margin-top: 6px;
}

/* ── TEMPORARY USGS STATUS LINE (header line 2) ── */
.usgs-status {
  font-size: 0.8rem;
  color: var(--subtext);
  font-style: italic;
  text-align: center;
  padding: 0 0 6px;
}

/* ── DESKTOP HEADER: legend left · weather center · filters right ── */
@media (min-width: 641px) {
  .legend {
    order: 1;
    width: auto;
    justify-content: flex-start;
    margin-top: 0;
  }
  .rain-badge { order: 2; margin-left: auto; margin-right: auto; }
  .filters    { order: 3; margin-left: 0; }
  /* desktop filter order: condition, drive, hours, rapids, stars */
  .filters .cond-filter[data-label="Condition"] { order: 1; }
  .filters #fltDrive                            { order: 2; }
  .filters #fltHours                            { order: 3; }
  .filters .cond-filter[data-label="Rapids"]    { order: 4; }
  .filters #fltStars                            { order: 5; }
  .filters #favOnlyBtn                          { order: 6; }
  .filters #clearFilters                        { order: 7; }
}

/* ── 7-DAY FORECAST TABLE ── */
.fc-box { max-width: 480px; max-height: 80vh; overflow-y: auto; }
.fc-row {
  display: flex;
  gap: 8px;
  align-items: baseline;
  padding: 7px 0;
  border-bottom: 1px solid #eef2f8;
  font-size: 0.85rem;
}
.fc-head {
  font-size: 0.62rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--subtext);
  padding-bottom: 4px;
  border-bottom: none;
}
.fc-day  { flex: 0 0 74px; font-weight: 600; color: var(--navy); }
.fc-head .fc-day { font-weight: 400; color: var(--subtext); }
.fc-temp { flex: 0 0 78px; }
.fc-head > div { white-space: nowrap; }
.fc-pop  { flex: 0 0 34px; }
.fc-amt  { flex: 0 0 40px; }
.fc-text { flex: 1 1 auto; color: var(--subtext); min-width: 0; }
.fc-head .fc-text { color: var(--subtext); }

@media (max-width: 640px) {
  .fc-box { max-width: 100%; }
  .fc-row { gap: 6px; font-size: 0.76rem; padding: 6px 0; }
  .fc-head { font-size: 0.6rem; }
  .fc-day  { flex: 0 0 60px; }
  .fc-temp { flex: 0 0 66px; }
  .fc-pop  { flex: 0 0 30px; }
  .fc-amt  { flex: 0 0 36px; }
}

/* ── MOBILE: collapse filters behind the Filters button ── */
@media (max-width: 640px) {
  #filtersToggle { display: inline-block; }
  #searchIconBtn {
    display: inline-flex; align-items: center; justify-content: center;
    margin-left: auto;
    font-size: 0.95rem;
    width: 34px; height: 34px; padding: 0;
    border-radius: 50%;
  }
  #searchWrap { display: none; }  /* mobile uses the icon + modal instead */
  .filters {
    display: none;
    order: 99;
    width: 100%;
    flex-wrap: wrap;
    justify-content: flex-start;
    gap: 8px;
    margin-top: 8px;
  }
  .filters.open { display: flex; }
  /* on mobile, render multi-select panels inline (no floating popup) */
  .filters .cond-filter { width: 100%; }
  .filters .cond-filter > button { display: none; }  /* label shown as heading instead */
  .filters .cond-filter::before {
    content: attr(data-label);
    display: block;
    font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--subtext); font-weight: 700; margin: 4px 2px 2px;
  }
  .cond-panel {
    position: static; box-shadow: none; padding: 6px 4px 2px;
    min-width: 0; display: block;
    columns: 2; -webkit-columns: 2;
  }
  /* all three selects: equal width, centered text */
  .filters select {
    flex: 0 0 calc(50% - 4px);
    text-align: center;
    text-align-last: center;
  }
  /* mobile order: Condition, Rapids, Drive, Hours, Stars, Clear All */
  .filters .cond-filter[data-label="Condition"] { order: 1; }
  .filters .cond-filter[data-label="Rapids"]    { order: 2; }
  .filters #fltDrive     { order: 3; }
  .filters #fltHours     { order: 4; }
  .filters #fltStars     { order: 5; }
  .filters #favOnlyBtn {
    order: 6;
    flex: 0 0 calc(50% - 4px);
    text-align: center;
  }
  .filters #clearFilters {
    order: 7;
    display: inline-block;
    flex: 1 1 100%;
    text-align: center;
    background: var(--navy);
    color: white;
  }
  .filters select, .cond-filter button, #filtersToggle, .rain-badge, #favOnlyBtn {
    font-size: 0.78rem;
    padding: 7px 10px;
  }
  .cond-panel label { font-size: 0.8rem; }
}

/* ── LAYOUT ── */
.container { max-width: 1600px; margin: 0 auto; padding: 24px 20px; }

.meta-bar {
  display: flex;
  justify-content: flex-start;
  align-items: center;
  margin-bottom: 18px;
  flex-wrap: wrap;
  gap: 10px;
}
.updated {
  font-size: 0.82rem;
  color: var(--subtext);
  font-style: italic;
}

/* ── LEGEND ── */
.legend {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  color: var(--text);
  white-space: nowrap;
}
.legend-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  flex-shrink: 0;
}

@media (max-width: 640px) {
  .legend {
    flex-wrap: nowrap;
    width: 100%;
    justify-content: space-between;
    gap: 4px;
  }
  .legend-item {
    font-size: 0.62rem;
    gap: 3px;
    letter-spacing: 0.01em;
  }
  .legend-dot { width: 9px; height: 9px; }
}

/* ── CARD ── */
.card {
  background: var(--card);
  border-radius: 14px;
  margin-bottom: 28px;
  box-shadow: 0 2px 16px rgba(13,44,84,0.09);
  overflow: hidden;
}
.card-header {
  background: var(--navy);
  color: white;
  padding: 8px 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
.card-header h2 {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 1.15rem;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  line-height: 1.2;
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 8px;
}
.card-header .count {
  font-size: 0.78rem;
  opacity: 0.65;
  font-weight: 400;
  margin-left: 0;
  white-space: nowrap;
}
.toggle-btn {
  background: rgba(255,255,255,0.15);
  color: white;
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 6px;
  padding: 3px 11px;
  cursor: pointer;
  flex-shrink: 0;
  font-family: 'Barlow', sans-serif;
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  transition: background 0.2s;
}
.toggle-btn:hover { background: rgba(255,255,255,0.25); }

/* ── TABLE ── */
.table-wrap { overflow: auto; max-height: 70vh; }
table { width: 100%; border-collapse: collapse; }
thead th {
  position: sticky;
  top: 0;
  z-index: 5;
  background: #e8eef8;
  color: var(--navy);
  padding: 9px 12px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 0.82rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  cursor: pointer;
  white-space: nowrap;
  user-select: none;
  box-shadow: inset 0 -2px 0 #ccd9ef;
}
thead th:hover { background: #d8e4f4; }
thead th::after { content: ' ↕'; opacity: 0.4; font-size: 0.7rem; }
thead th.sorted-asc::after { content: ' ↑'; opacity: 1; }
thead th.sorted-desc::after { content: ' ↓'; opacity: 1; }

tbody tr { transition: filter 0.1s; }
tbody tr:hover { filter: brightness(0.96); }

td {
  padding: 9px 9px;
  font-size: 0.88rem;
  border-bottom: 1px solid rgba(0,0,0,0.05);
  vertical-align: middle;
  white-space: nowrap;
}

/* condition color bands applied to tr */
tr.cond-below  td { background: var(--below-bg); }
tr.cond-low    td { background: var(--low-bg); }
tr.cond-medium td { background: var(--medium-bg); }
tr.cond-high   td { background: var(--high-bg); }
tr.cond-above  td { background: var(--above-bg); }
tr.cond-nodata td { background: var(--nodata-bg); }

/* left color bar */
tr.cond-below  td:first-child { border-left: 4px solid var(--below-bar); }
tr.cond-low    td:first-child { border-left: 4px solid var(--low-bar); }
tr.cond-medium td:first-child { border-left: 4px solid var(--medium-bar); }
tr.cond-high   td:first-child { border-left: 4px solid var(--high-bar); }
tr.cond-above  td:first-child { border-left: 4px solid var(--above-bar); }
tr.cond-nodata td:first-child { border-left: 4px solid var(--nodata-bar); }

.river-name { font-weight: 600; color: var(--navy); }
.trip-name a { color: var(--navy-mid); text-decoration: none; }
.trip-name a:hover { text-decoration: underline; }
.drive-cell, .num-cell, .flow-cell, .stage-cell {
  text-align: right;
  white-space: nowrap;
  color: var(--text);
  font-size: 0.88rem;
  font-variant-numeric: tabular-nums;
  width: 1%;            /* shrink-to-content with nowrap */
  padding-left: 6px;
  padding-right: 6px;
}
.cond-cell { text-align: center; width: 1%; }
.usgs-link { width: 1%; text-align: center; }
.trend-cell { min-width: 100px; width: 1%; }
/* Body of Water and Trip absorb the remaining width */
.river-name, .trip-name { width: auto; }

.trend-cell { text-align: center; white-space: nowrap; }
.spark { vertical-align: middle; }

.runnable-toggle {
  display: flex;
  align-items: center;
  gap: 7px;
  cursor: pointer;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--navy);
  background: white;
  padding: 6px 14px;
  border-radius: 20px;
  box-shadow: 0 1px 6px rgba(13,44,84,0.12);
  user-select: none;
}
.runnable-toggle input { accent-color: var(--medium-bar); width: 16px; height: 16px; cursor: pointer; }

.rain-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.83rem;
  font-weight: 600;
  color: var(--navy);
  background: white;
  padding: 6px 14px;
  border-radius: 20px;
  box-shadow: 0 1px 6px rgba(13,44,84,0.12);
}

/* ── TRIP MODAL ── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(8,29,56,0.55);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  z-index: 2000;
  padding: 170px 20px 20px;
  overflow-y: auto;
}
.modal-box {
  background: white;
  border-radius: 14px;
  max-width: 356px;
  width: 100%;
  padding: 22px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.3);
  position: relative;
}
.modal-box h3 {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 1.3rem;
  color: var(--navy);
  letter-spacing: 0.03em;
  margin-top: 0;
  margin-bottom: 2px;
}
.modal-box .modal-trip {
  color: var(--subtext);
  font-size: 0.9rem;
  margin-bottom: 14px;
}
.notes-textarea {
  scrollbar-width: thin;
  scrollbar-color: #ccd9ef transparent;
}
.notes-textarea::-webkit-scrollbar { width: 6px; }
.notes-textarea::-webkit-scrollbar-track { background: transparent; }
.notes-textarea::-webkit-scrollbar-thumb { background: #ccd9ef; border-radius: 3px; }

.modal-box .modal-row {
  font-size: 0.88rem;
  margin: 8px 0;
}
.modal-box .modal-row b { color: var(--navy); }
.modal-box .maps-link {
  display: block;
  text-align: center;
  margin-top: 14px;
  background: var(--navy-mid);
  color: white;
  text-decoration: none;
  padding: 9px 18px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 0.88rem;
}
.modal-nav-arrow {
  position: fixed;
  top: 205px;
  z-index: 2001;
  width: 28px;
  height: 44px;
  color: white;
  font-size: 1.9rem;
  font-weight: 700;
  line-height: 1;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  text-shadow: 0 0 3px rgba(0,0,0,0.9), 0 0 8px rgba(0,0,0,0.7), 0 2px 4px rgba(0,0,0,0.8);
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.modal-nav-arrow:hover { color: rgba(255,255,255,0.75); }
.modal-nav-left  { left: calc(50% - 216px); }
.modal-nav-right { right: calc(50% - 216px); }
@media (max-width: 480px) {
  .modal-nav-arrow { width: 22px; height: 40px; font-size: 1.5rem; top: auto; bottom: 33vh; }
  .modal-nav-left  { left: 2px; }
  .modal-nav-right { right: 2px; }
}

.modal-close {
  position: absolute;
  top: 10px;
  right: 14px;
  background: none;
  border: none;
  font-size: 1.4rem;
  color: var(--subtext);
  cursor: pointer;
  line-height: 1;
}
tbody tr { cursor: pointer; }

/* ── MOBILE TRIP CARDS ── */
.card-list { display: none; padding: 10px 12px 14px; }

.trip-card {
  background: white;
  border-radius: 10px;
  padding: 12px 14px 12px 16px;
  margin-bottom: 10px;
  border-left: 5px solid var(--nodata-bar);
  box-shadow: 0 1px 6px rgba(13,44,84,0.1);
  cursor: pointer;
  position: relative;
}
.trip-card.cond-below  { border-left-color: var(--below-bar);  background: var(--below-bg); }
.trip-card.cond-low    { border-left-color: var(--low-bar);    background: var(--low-bg); }
.trip-card.cond-medium { border-left-color: var(--medium-bar); background: var(--medium-bg); }
.trip-card.cond-high   { border-left-color: var(--high-bar);   background: var(--high-bg); }
.trip-card.cond-above  { border-left-color: var(--above-bar);  background: var(--above-bg); }

.trip-card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
}
.trip-card-name { font-weight: 600; color: var(--navy); font-size: 0.95rem; }
.trip-card-trip { font-size: 0.82rem; color: var(--subtext); margin-top: 1px; }
.trip-card-stats {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-top: 9px;
  font-size: 0.8rem;
  color: var(--text);
  flex-wrap: wrap;
}
.trip-card-stats b { font-variant-numeric: tabular-nums; }
.trip-card-stats .stat-label { color: var(--subtext); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; }
.trip-card-water { margin-top: 5px; gap: 8px; flex-wrap: nowrap; }
.card-empty { text-align: center; color: var(--subtext); font-style: italic; padding: 16px; font-size: 0.88rem; }

@media (max-width: 640px) {
  .table-wrap { display: none; }
  .card-list { display: block; }
}
.cond-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 20px;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  white-space: nowrap;
}
.badge-below  { background: var(--below-bar);  color: white; }
.badge-low    { background: var(--low-bar);    color: white; }
.badge-medium { background: var(--medium-bar); color: white; }
.badge-high   { background: var(--high-bar);   color: #333; }
.badge-above  { background: var(--above-bar);  color: white; }
.badge-nodata { background: var(--nodata-bar); color: white; }

.thresholds {
  font-size: 0.72rem;
  color: var(--subtext);
  white-space: nowrap;
}
.usgs-link a {
  color: var(--navy-mid);
  text-decoration: none;
  font-size: 0.78rem;
}
.usgs-link a:hover { text-decoration: underline; }

.fav-heart {

  user-select: none;

}

.loading-row td {

  padding: 20px;
  color: var(--subtext);
  font-style: italic;
  font-size: 0.88rem;
}

// parse a rapids string into the set of classes it contains
function rapidsRank(str) {
  if (!str) return 99;
  const s = String(str);
  if (/flatwater/i.test(s)) return 0;
  if (/riffles/i.test(s)) return 1;
  const order = ['I','II','III','IV','V'];
  const found = s.match(/(IV|V|III|II|I)/g) || [];
  let max = -1;
  found.forEach(c => { const i = order.indexOf(c); if (i > max) max = i; });
  return max < 0 ? 98 : 2 + max;
}

function rapidsClasses(str) {
  if (!str) return [];
  const s = String(str);
  if (/flatwater/i.test(s)) return ['Flatwater'];
  if (/riffles/i.test(s)) return ['Riffles'];
  const all = s.match(/(IV|V|III|II|I)/g) || [];
  return [...new Set(all)];
}

// ─── CONDITION LOGIC ─────────────────────────────────────────────────────────
function getCondition(trip) {
  const flow = trip._flow;
  if (flow === null || flow === undefined) return 'nodata';
  if (trip.below === null) return 'nodata'; // no thresholds for this trip
  const belowNum = parseFloat(trip.below);
  const lowNum   = parseFloat(trip.low);
  const medNum   = parseFloat(trip.medium);
  const highNum  = parseFloat(trip.high);
  if (isNaN(belowNum)) return 'nodata';
  if (flow < belowNum)  return 'below';
  if (flow < lowNum)    return 'low';
  if (flow < medNum)    return 'medium';
  if (flow < highNum)   return 'high';
  return 'above';
}

function sparkline(series, trend, width) {
  if (!series || series.length < 2) return '<span style="color:var(--subtext)">—</span>';
  const w = width || 72, h = 20, pad = 2;
  const min = Math.min(...series), max = Math.max(...series);
  const range = (max - min) || 1;
  const pts = series.map((v, i) => {
    const x = pad + (i / (series.length - 1)) * (w - pad * 2);
    const y = h - pad - ((v - min) / range) * (h - pad * 2);
    return x.toFixed(1) + ',' + y.toFixed(1);
  }).join(' ');
  const color = trend === '↑' ? '#2e9e4f' : trend === '↓' ? '#d63b3b' : '#5a6a7a';
  // arrows removed site-wide; direction is conveyed by line color alone
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`
    + `<title>48h flow: ${min}–${max} CFS (trend: ${trend})</title>`
    + `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round"/>`
    + `</svg>`;
}

function starIcons(n) {
  if (n === null || n === undefined) return '<span style="color:var(--subtext)">—</span>';
  const full = Math.floor(n);
  const half = (n - full) >= 0.5;
  const star = f => `<svg width="13" height="13" viewBox="0 0 24 24" style="vertical-align:-2px"><defs><linearGradient id="hg"><stop offset="50%" stop-color="#e8a800"/><stop offset="50%" stop-color="#d8dee6"/></linearGradient></defs><path fill="${f}" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg>`;
  let out = '';
  for (let i = 0; i < full; i++) out += star('#e8a800');
  if (half) out += star('url(#hg)');
  return `<span title="${n} stars" style="white-space:nowrap">${out}</span>`;
}

function fmtNum(v) { return v === null || v === undefined ? '—' : Math.round(v * 100) / 100; }

function condBadge(cond) {
  if (cond === 'nodata') return '<span style="color:var(--subtext)">—</span>';
  const labels = { below:'Below', low:'Low', medium:'Medium', high:'High', above:'Above' };
  return `<span class="cond-badge badge-${cond}">${labels[cond]||cond}</span>`;
}

function thresholdText(t) {
  if (t.below === null) return '—';
  const ab = String(t.above);
  return `<${t.below} · ${t.below}–${t.low} · ${t.low}–${t.medium} · ${t.medium}–${ab}`;
}

// ─── TABLE RENDERING ─────────────────────────────────────────────────────────
function getTypes() {
  const types = [...new Set(TRIPS.map(t => t.type))];
  // Casual always first, then Whitewater, then any future types
  const order = ['Casual', 'Whitewater'];
  return types.sort((a, b) => {
    const ia = order.indexOf(a), ib = order.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });
}

function typeIcon(type) {
  const icons = { Whitewater:'🌊', Casual:'🛶' };
  return icons[type] || '🚣';
}

  return [
    { key:'fav',       label:'♥' },
    { key:'river',     label:'Body of Water' },
    { key:'trip',      label:'Trip' },
    ...(type !== 'Whitewater' ? [{ key:'stars', label:'Stars' }] : []),
    { key:'rapids',    label:'Rapids' },
    { key:'condition', label:'Condition' },
    { key:'drive',     label:'Drive (min)' },
    { key:'hours',     label:'Hours' },
    { key:'miles',     label:'Miles' },
    { key:'shuttle',   label:'Bike Shuttle' },
    { key:'trend',     label:'History' },
    { key:'flow',      label:'Flow (CFS)' },
    { key:'stage',     label:'Gage (ft)' },
    { key:'gauge',     label:'Gauge' },
  ];
}

let TYPE_TOTALS = {};
let RENDERED_ORDER = {};  // type -> array of trip indices, in current filtered/sorted order
// Attach live values to every trip (tables and map share these)
function prepTrips() {
  TRIPS.forEach(t => {
    const key = normId(t.usgs);
    const d = key ? liveData[key] : null;
    t._flow  = d?.flow  ?? null;
    t._drive = t.driveLive ?? t.drive;
    t._stage = d?.stage ?? null;
    t._trend = d?.trend ?? '—';
    t._series = d?.series ?? null;
    t._condition = getCondition(t);
  });
}

// Single source of truth for filtering — used by tables, cards, and map pins.
// Missing data passes (lenient), matching the established behavior.
function passesFilters(t) {
  if (favOnly && !isFavorite(t)) return false;
  if (searchQuery) {
    const hay = [t.river, t.trip, t.inName, t.outName].filter(Boolean).join(' ').toLowerCase();
    if (!hay.includes(searchQuery)) return false;
  }
  if (fltConds.length && !fltConds.includes(t._condition)) return false;
  if (fltRapids.length && t.rapids && !rapidsClasses(t.rapids).some(c => fltRapids.includes(c))) return false;
  if (fltDrive !== null && t._drive != null && t._drive > fltDrive) return false;
  if (fltHours !== null && t.hours !== null && t.hours > fltHours) return false;
  if (fltStars !== null && t.type !== 'Whitewater' && (t.stars === null || t.stars < fltStars)) return false;
  return true;
}

function renderTable(type) {
  const tbody = document.getElementById(`tbody-${type}`);
  if (!tbody) return;
  const ss = sortState[type] || { key: 'drive', dir: 1 };
  prepTrips();
  let trips = TRIPS.filter(t => t.type === type && passesFilters(t));

  // sort
  trips.sort((a, b) => {
    let av = a[ss.key] ?? a['_'+ss.key] ?? '';
    let bv = b[ss.key] ?? b['_'+ss.key] ?? '';
    if (ss.key === 'fav') { av = isFavorite(a) ? 0 : 1; bv = isFavorite(b) ? 0 : 1; }
    if (ss.key === 'condition') {
      const rank = { below: 0, low: 1, medium: 2, high: 3, above: 4, nodata: 5 };
      av = rank[a._condition] ?? 5; bv = rank[b._condition] ?? 5;
    }
    if (ss.key === 'drive') { av = a._drive ?? Infinity; bv = b._drive ?? Infinity; }
    if (ss.key === 'stars') { av = a.stars ?? -Infinity; bv = b.stars ?? -Infinity; }
    if (ss.key === 'rapids') { av = rapidsRank(a.rapids); bv = rapidsRank(b.rapids); }
    if (ss.key === 'hours') { av = a.hours ?? Infinity; bv = b.hours ?? Infinity; }
    if (ss.key === 'miles') { av = a.miles ?? Infinity; bv = b.miles ?? Infinity; }
    if (ss.key === 'shuttle') { av = a.totalHr ?? Infinity; bv = b.totalHr ?? Infinity; }
    if (ss.key === 'flow')  { av = a._flow  ?? -Infinity; bv = b._flow  ?? -Infinity; }
    if (ss.key === 'stage') { av = a._stage ?? -Infinity; bv = b._stage ?? -Infinity; }
    if (av < bv) return -ss.dir;
    if (av > bv) return  ss.dir;
    return 0;
  });

  // update sort indicators
  getColumns(type).forEach(c => {
    const el = document.getElementById(`th-${type}-${c.key}`);
    if (!el) return;
    el.className = '';
    if (ss.key === c.key) el.className = ss.dir === 1 ? 'sorted-asc' : 'sorted-desc';
  });

  // remember this render's order so the popup can navigate prev/next through it
  RENDERED_ORDER[type] = trips.map(t => TRIPS.indexOf(t));

  const cardList = document.getElementById(`cards-${type}`);

  // update "X of XX trips" in section header
  const total = TYPE_TOTALS[type] ?? (TYPE_TOTALS[type] = TRIPS.filter(t => t.type === type).length);
  const countEl = document.querySelector(`#section-${type} .count`);
  if (countEl) countEl.textContent = trips.length === total ? `${total} trips` : `${trips.length} of ${total} trips`;

  if (!trips.length) {
    tbody.innerHTML = `<tr class="loading-row"><td colspan="${getColumns(type).length}">No trips match your current filters</td></tr>`;
    if (cardList) cardList.innerHTML = `<div class="card-empty">No trips match your current filters</div>`;
    return;
  }

  tbody.innerHTML = trips.map(t => {
    const cond = t._condition;
    const flow  = t._flow  !== null ? t._flow.toLocaleString()  : '—';
    const stage = t._stage !== null ? t._stage.toFixed(2) : '—';
    const trend = sparkline(t._series, t._trend || '—', 72);
    const tripName = (t.links && t.links.length)
      ? `<a href="${t.links[0].url}" target="_blank" rel="noopener">${t.trip}</a>`
      : t.trip;
    const gaugeHtml = t.usgsLink
      ? `<a href="${t.usgsLink}" target="_blank" rel="noopener" title="${t.gaugeName||''}">${t.usgs || 'USGS'}</a>`
      : (t.gaugeName && t.gaugeName !== '-' ? `<span title="${t.gaugeName}" style="font-size:0.75rem;color:var(--subtext)">${t.gaugeName.replace(/ - USGS.*/,'').substring(0,30)}…</span>` : '—');

    const _idx = TRIPS.indexOf(t);
    return `<tr class="cond-${cond}" onclick="openTripModal(${_idx}, event)">
      <td class="cond-cell">${favIcon(t, _idx)}</td>
      <td class="river-name">${t.river}</td>
      <td class="trip-name">${tripName}</td>
      ${type !== 'Whitewater' ? `<td class="cond-cell">${starIcons(t.stars)}</td>` : ''}
      <td class="cond-cell">${t.rapids ?? '—'}</td>
      <td class="cond-cell">${condBadge(cond)}</td>
      <td class="drive-cell" title="${t.driveLive != null ? 'Live estimate from your location' : 'From spreadsheet'}">${t._drive ?? '—'}</td>
      <td class="num-cell">${t.hours!=null && t.type==='Whitewater' ? '~'+fmtNum(t.hours) : fmtNum(t.hours)}</td>
      <td class="num-cell">${fmtNum(t.miles)}</td>
      <td class="num-cell">${t.totalHr != null ? fmtNum(t.totalHr) + ' hrs' : '—'}</td>
      <td class="trend-cell">${trend}</td>
      <td class="flow-cell">${flow}</td>
      <td class="stage-cell">${stage}</td>
      <td class="usgs-link">${gaugeHtml}</td>
    </tr>`;
  }).join('');

  // mobile card view (same data, sort, and filter as the table)
  if (cardList) {
    cardList.innerHTML = trips.map(t => {
      const cond = t._condition;
      const flow  = t._flow  !== null ? t._flow.toLocaleString()  : '—';
      const stage = t._stage !== null ? t._stage.toFixed(2) : '—';
      const _cidx = TRIPS.indexOf(t);
      return `<div class="trip-card cond-${cond}" onclick="openTripModal(${_cidx}, event)">
        <div class="trip-card-top">
          <div>
            <div class="trip-card-name">${t.river} ${t.type !== 'Whitewater' && t.stars != null ? '<span style="margin-left:2px">'+starIcons(t.stars)+'</span>' : ''}</div>
            <div class="trip-card-trip">${t.trip}</div>
          </div>
          ${condBadge(cond)}
        </div>
        <div class="trip-card-stats">
          <span><span class="stat-label">Drive</span> <b>${t._drive ?? '—'}</b> min</span>
          <span><span class="stat-label">Hours</span> <b>${t.hours!=null && t.type==='Whitewater' ? '~'+fmtNum(t.hours) : fmtNum(t.hours)}</b></span>
          <span><span class="stat-label">Miles</span> <b>${fmtNum(t.miles)}</b></span>
        </div>
        <div class="trip-card-stats trip-card-water">
          <span><span class="stat-label">Rapids</span> <b>${t.rapids ?? '—'}</b></span>
          <span><span class="stat-label">Flow</span> <b>${flow}</b> CFS</span>
          <span>${sparkline(t._series, t._trend || '—', 60)}</span>
          <span style="margin-left:auto">${favIcon(t, _cidx, '15px')}</span>
        </div>
      </div>`;
    }).join('');
  }
}

function sortBy(type, key) {
  const ss = sortState[type] || { key: null, dir: 1 };
  if (ss.key === key) {
    sortState[type] = { key, dir: ss.dir * -1 };
  } else {
    sortState[type] = { key, dir: 1 };
  }
  renderTable(type);
}

function fitTrips() {
  if (!nspMap) return;
  const pts = TRIPS.filter(t => t.startCoord && passesFilters(t)).map(t => t.startCoord);
  if (USER_LOCATION) pts.push([USER_LOCATION.lat, USER_LOCATION.lng]);
  if (pts.length) nspMap.fitBounds(L.latLngBounds(pts), { padding: [25, 25] });
}

function toggleMap() {
  const m = document.getElementById('map');
  const btn = document.getElementById('mapToggleBtn');
  const hidden = m.classList.toggle('hidden');
  btn.textContent = hidden ? 'Show' : 'Hide';
  if (!hidden && window.nspMap) setTimeout(() => window.nspMap.invalidateSize(), 50);
}

function toggleFilterGroup(e) {
  e.stopPropagation();
  const open = document.getElementById('filterGroup').classList.toggle('open');
  document.getElementById('filtersToggle').classList.toggle('active', open);
}

function toggleSection(type) {
  const wrap = document.getElementById(`wrap-${type}`);
  const cards = document.getElementById(`cards-${type}`);
  const btn = document.querySelector(`#section-${type} .toggle-btn`);

  btn.textContent = nowHidden ? 'Show' : 'Hide';
}

// ─── USGS LIVE DATA ──────────────────────────────────────────────────────────
const normId = id => id ? String(parseInt(id, 10)) : null;

async function fetchUSGS() {
  const ids = [...new Set(TRIPS.map(t => t.usgs).filter(Boolean))];
  const usgsUrl = 'https://waterservices.usgs.gov/nwis/iv/?format=json'
    + '&sites=' + ids.join(',')
    + '&parameterCd=00060,00065'
    + '&period=P2D';

  // 6s timeout per attempt so a slow/hanging proxy can't stall the page
  async function timedFetch(url, ms = 6000) {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), ms);
    try {
      const res = await fetch(url, { cache: 'no-cache', signal: ctl.signal });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    } finally {
      clearTimeout(timer);
    }
  }

  // Direct first — works from any https host (GitHub Pages, Netlify).
  // Proxies are fallbacks only.
  async function tryDirect() {
    return timedFetch(usgsUrl);
  }
  async function tryAlloriginsGet() {
    const wrapper = await timedFetch('https://api.allorigins.win/get?url=' + encodeURIComponent(usgsUrl), 8000);
    return JSON.parse(wrapper.contents);
  }
  async function tryCorsProxy() {
    return timedFetch('https://corsproxy.io/?url=' + encodeURIComponent(usgsUrl), 8000);
  }

  const attempts = [tryDirect, tryAlloriginsGet, tryCorsProxy];
  let data = null;
  for (let i = 0; i < attempts.length; i++) {
    try {
      console.log('[NSP] USGS fetch attempt', i + 1);
      const st = document.getElementById('usgsStatus');
      if (st) st.textContent = `Fetching live USGS data… (attempt ${i+1} of ${attempts.length})`;
      data = await attempts[i]();
      console.log('[NSP] USGS fetch success on attempt', i + 1);
      break;
    } catch (e) {
      console.warn('[NSP] Attempt', i + 1, 'failed:', e.message);
    }
  }

  let usingCache = false;
  if (data) {
    // cache successful response, tagged with the gauge list it actually covers
    try {
      localStorage.setItem('nsp_usgs_cache', JSON.stringify({ ts: Date.now(), gauges: ids, data }));
    } catch(e) {}
  } else {
    // all proxies failed — fall back to cached data, but only if it actually
    // covers every gauge we currently need (otherwise newly-added trips would
    // silently show no data while looking like everything else is fine)
    try {
      const cached = JSON.parse(localStorage.getItem('nsp_usgs_cache'));
      const cachedGauges = new Set(cached?.gauges || []);
      const coversAll = cached?.data && ids.every(id => cachedGauges.has(id));
      if (coversAll) {
        data = cached.data;
        usingCache = true;
        console.log('[NSP] Using cached data from', new Date(cached.ts).toLocaleString());
      } else if (cached?.data) {
        console.warn('[NSP] Cached data is stale (missing gauges for current trip list) — not using it');
      }
    } catch(e) {}
  }

  if (!data) {
    document.getElementById('usgsStatus').innerHTML =
      '⚠️ Live data unavailable — <a href="#" onclick="fetchUSGS();return false;" style="color:var(--navy-mid)">Retry</a>';
    const ut = document.getElementById('updatedTime');
    ut.style.display = '';
    ut.innerHTML = '⚠️ Live data unavailable — <a href="#" onclick="fetchUSGS();return false;" style="color:var(--navy-mid)">Retry</a>';
    return;
  }

  data.value?.timeSeries?.forEach(s => {
    const site  = normId(s.sourceInfo.siteCode[0].value);
    const param = s.variable.variableCode[0].value;
    const vals  = s.values[0]?.value;
    if (!liveData[site]) liveData[site] = {};
    if (vals?.length) {
      const clean = vals.filter(v => parseFloat(v.value) > -999990);
      if (!clean.length) return;
      const latest = parseFloat(clean.at(-1).value);
      const past   = parseFloat(clean[0].value);
      if (param === '00060') {
        liveData[site].flow  = isNaN(latest) ? null : latest;
        liveData[site].trend = (latest > past) ? '↑' : (latest < past) ? '↓' : '→';
        // downsample full series to ~40 points for sparkline
        const nums = clean.map(v => parseFloat(v.value)).filter(n => !isNaN(n));
        const step = Math.max(1, Math.floor(nums.length / 40));
        liveData[site].series = nums.filter((_, idx) => idx % step === 0);
      }
      if (param === '00065') {
        liveData[site].stage = isNaN(latest) ? null : latest;
      }
    }
  });

  getTypes().forEach(type => renderTable(type));
  updateMapPins();
  const st = document.getElementById('usgsStatus');
  if (st) st.style.display = 'none';
  const ut = document.getElementById('updatedTime');
  ut.style.display = '';
  ut.textContent = usingCache
    ? '⚠️ Showing cached data (live fetch failed) — last successful update: ' +
      new Date(JSON.parse(localStorage.getItem('nsp_usgs_cache')).ts).toLocaleString()
    : 'Last updated: ' + new Date().toLocaleString();
}

// ─── MAP ──────────────────────────────────────────────────────────────────────
const mapMarkers = [];  // { marker, trip }

const CONDITION_COLORS = {
  below:  { fill: '#e05a2b', stroke: '#a83e1a' },
  low:    { fill: '#e8c400', stroke: '#a08600' },
  medium: { fill: '#2e9e4f', stroke: '#1d6f36' },
  high:   { fill: '#7db500', stroke: '#567d00' },
  above:  { fill: '#d63b3b', stroke: '#992424' },
  nodata: { fill: '#b0bec5', stroke: '#78909c' },
};

let nspMap = null; window.nspMap = null;

// Heart-shaped marker icon for favorited trips, colored by condition
function heartMarkerIcon(fillColor, strokeColor) {
  const svg = `<svg width="100%" height="100%" viewBox="0 0 24 22" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 20 C12 20 2 13.5 2 7.5 C2 4 4.5 2 7.5 2 C9.5 2 11 3 12 4.5 C13 3 14.5 2 16.5 2 C19.5 2 22 4 22 7.5 C22 13.5 12 20 12 20 Z"
      fill="${fillColor}" stroke="${strokeColor}" stroke-width="1.5"/>
  </svg>`;
  return L.divIcon({ className: 'fav-map-icon', html: svg, iconSize: [16, 14.5], iconAnchor: [8, 12], popupAnchor: [0, -12] });
}

// Build the appropriate marker (heart if favorited, circle otherwise) for a trip
function createTripMarker(t, idx, cond) {
  const c = CONDITION_COLORS[cond] || CONDITION_COLORS.nodata;
  let marker;
  if (isFavorite(t)) {
    marker = L.marker(t.startCoord, { icon: heartMarkerIcon(c.fill, c.stroke) });
  } else {
    marker = L.circleMarker(t.startCoord, { radius: 5.5, fillColor: c.fill, color: c.stroke, weight: 2, opacity: 1, fillOpacity: 0.9 });
  }
  marker.on('click', () => openTripModal(idx));
  return marker;
}

function initMap() {
  window.nspMap = nspMap = L.map('map');
  const map = nspMap;
  addBaseLayers(map, 'street');

  TRIPS.forEach((t, idx) => {
    if (t.startCoord) {
      const marker = createTripMarker(t, idx, 'nodata').addTo(map);
      mapMarkers.push({ marker, trip: t, idx, isFav: isFavorite(t) });
    }
  });

  // default view: fit all trip pins
  const allCoords = TRIPS.filter(t => t.startCoord).map(t => t.startCoord);
  if (allCoords.length) {
    map.fitBounds(L.latLngBounds(allCoords), { padding: [25, 25] });
  } else {
    map.setView([43.15, -88.05], 10);
  }
}

function showUserOnMap(lat, lng) {
  if (!nspMap) return;
  // pulsing blue dot for user location
  L.circleMarker([lat, lng], {
    radius: 9, fillColor: '#1e88e5', color: '#ffffff',
    weight: 3, opacity: 1, fillOpacity: 1
  }).addTo(nspMap).bindPopup('<b>You are here</b>');
  // re-fit bounds to include user location alongside all pins
  const allCoords = TRIPS.filter(t => t.startCoord).map(t => t.startCoord);
  allCoords.push([lat, lng]);
  nspMap.fitBounds(L.latLngBounds(allCoords), { padding: [25, 25] });
}

function updateMapPins() {
  prepTrips();
  mapMarkers.forEach(entry => {
    const { trip, idx } = entry;
    const nowFav = isFavorite(trip);
    const c = CONDITION_COLORS[trip._condition] || CONDITION_COLORS.nodata;
    if (nowFav !== entry.isFav) {
      // favorite status changed — marker type must change (circle <-> heart)
      const wasOnMap = nspMap.hasLayer(entry.marker);
      nspMap.removeLayer(entry.marker);
      entry.marker = createTripMarker(trip, idx, trip._condition);
      entry.isFav = nowFav;
      if (wasOnMap) entry.marker.addTo(nspMap);
    } else if (nowFav) {
      // still a heart — just update its color
      entry.marker.setIcon(heartMarkerIcon(c.fill, c.stroke));
    } else {
      // still a circle — just update its color
      entry.marker.setStyle({ fillColor: c.fill, color: c.stroke });
    }
  });
  updateMapVisibility();
}

// Hide pins for trips filtered out of the tables
function updateMapVisibility() {
  if (!nspMap) return;
  prepTrips();
  mapMarkers.forEach(({ marker, trip }) => {
    const show = passesFilters(trip);
    const on = nspMap.hasLayer(marker);
    if (show && !on) marker.addTo(nspMap);
    else if (!show && on) nspMap.removeLayer(marker);
  });
}

// ─── TRIP MODAL ──────────────────────────────────────────────────────────────
function lastDateAt(usgs, thr, needBelow) {
  const arr = HIST_DAILY[normId(usgs)];
  if (!arr?.length) return null;
  for (let i = arr.length - 1; i >= 0; i--) {
    const [d, f] = arr[i];
    if (needBelow ? f < thr : f >= thr) return d;
  }
  return null;
}

function lastDateValue(usgs, thr, needBelow) {
  const d = lastDateAt(usgs, thr, needBelow);
  return d
    ? new Date(d + 'T12:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })
    : 'not in the past year';
}

// CFS band for a given condition, e.g. Low = below→low, Above = high+
function condRange(t, cond) {
  if (t.below === null) return '';
  const n = v => Number(v).toLocaleString();
  const lo = t.below, lowT = t.low, medT = t.medium, hiT = t.high;
  if (cond === 'below')  return `<${n(lo)} CFS`;
  if (cond === 'low')    return `${n(lo)}–${n(lowT)} CFS`;
  if (cond === 'medium') return `${n(lowT)}–${n(medT)} CFS`;
  if (cond === 'high')   return `${n(medT)}–${n(hiT)} CFS`;
  if (cond === 'above')  return `${n(hiT)}+ CFS`;
  return '';
}

function currentCondHtml(t) {
  // pull live flow and compute condition (same logic as tables)
  const d = t.usgs ? liveData[normId(t.usgs)] : null;
  const flow = d?.flow ?? null;
  if (flow === null) return '';
  t._flow = flow;
  const cond = getCondition(t);
  const sub = s => ` <span style="font-size:0.8rem;color:var(--subtext)">${s}</span>`;
  const curRange = condRange(t, cond);

  let html = `<div class="modal-row"><b>Current flow:</b> ${flow.toLocaleString()} CFS &nbsp;${condBadge(cond)}${curRange ? sub('(' + curRange + ')') : ''}</div>`;

  if (t.below !== null) {
    const lowT = parseFloat(t.low), medT = parseFloat(t.medium), hiT = parseFloat(t.high),
          lo = parseFloat(t.below);
    // next condition closer to ideal: [badge] (x–y CFS, last: MMM DD, YYYY)
    const nextLine = (badge, rangeCond, thr, needBelow) =>
      `<div class="modal-row">${condBadge(badge)}` +
      sub(`(${condRange(t, rangeCond)}, last: ${lastDateValue(t.usgs, thr, needBelow)})`) +
      `</div>`;
    if (cond === 'below')      html += nextLine('low',    'low',    lo,   false);
    else if (cond === 'low')   html += nextLine('medium', 'medium', lowT, false);
    else if (cond === 'high')  html += nextLine('medium', 'medium', medT, true);
    else if (cond === 'above') html += nextLine('high',   'high',   hiT,  true);
  }
  return html;
}

function hrMin(minutes) {
  const h = Math.floor(minutes / 60), m = Math.round(minutes % 60);
  return h >= 1 ? `${h} hr ${m} min` : `${m} min`;
}

function openShuttleModal(idx) {
  const t = TRIPS[idx];
  if (!t || t.driveHE == null) return;
  const rows = [
    ['Drive: Home → End (drop off bike)', t.driveHE],
    ['Drive: End → Start', t.driveES],
    ['Paddle: Start → End', t.hours != null ? t.hours * 60 : null],
    ['Bike: End → Start (put bike on car)', t.bikeES],
    ['Drive: Start → End (put kayak on car)', t.driveES],
    ['Drive: End → Home', t.driveHE],
  ];
  const rowsHtml = rows.map(([label, min]) =>
    `<div class="modal-row" style="display:flex;justify-content:space-between;gap:12px">
      <span>${label}</span><span style="color:var(--subtext)">${min != null ? hrMin(min) : '—'}</span>
    </div>`
  ).join('');

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  overlay.innerHTML = `
    <div class="modal-box" style="max-width:380px">
      <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">×</button>
      <h3>${t.river}</h3>
      <div class="modal-trip">${t.trip}</div>
      <div class="modal-row" style="font-weight:700;margin-top:6px">Bike Shuttle Breakdown</div>
      ${rowsHtml}
      <div class="modal-row" style="display:flex;justify-content:space-between;gap:12px;border-top:1px solid #eee;margin-top:6px;padding-top:8px;font-weight:700">
        <span>Total</span><span>${hrMin(rows.reduce((s,[,m]) => s + (m||0), 0))}</span>
      </div>
    </div>`;
  document.body.appendChild(overlay);
}

// Build the prev/next arrow buttons for the trip popup, based on that trip's
// position within its type's currently filtered/sorted table order.
function tripNavArrowsHtml(idx) {
  const t = TRIPS[idx];
  const order = RENDERED_ORDER[t.type] || [];
  if (order.length < 2) return { left: '', right: '' };
  const pos = order.indexOf(idx);
  if (pos === -1) return { left: '', right: '' };
  const btn = (dir, symbol) =>
    `<span role="button" tabindex="0" class="modal-nav-arrow modal-nav-${dir === -1 ? 'left' : 'right'}" onclick="navigateTrip(${dir}, event)" onkeydown="if(event.key==='Enter'||event.key===' '){navigateTrip(${dir}, event);}" aria-label="${dir === -1 ? 'Previous' : 'Next'} trip">${symbol}</span>`;
  return { left: btn(-1, '‹'), right: btn(1, '›') };
}

function navigateTrip(dir, ev) {
  if (ev) ev.stopPropagation();
  const overlay = document.querySelector('.modal-overlay');
  if (!overlay || overlay.dataset.tripIdx === undefined) return;
  const curIdx = parseInt(overlay.dataset.tripIdx, 10);
  const t = TRIPS[curIdx];
  const order = RENDERED_ORDER[t.type] || [];
  const pos = order.indexOf(curIdx);
  if (pos === -1) return;
  const nextPos = (pos + dir + order.length) % order.length;  // wraps at both ends
  overlay.remove();
  openTripModal(order[nextPos]);
}

function openTripModal(idx, ev) {
  // don't hijack clicks on links inside the row
  if (ev && ev.target.tagName === 'A') return;
  const t = TRIPS[idx];
  if (!t) return;

  const hasCoord = !!t.startCoord;
  const fmtLoc = (name, coord) => {
    const g = coord ? `(${coord[0].toFixed(2)}, ${coord[1].toFixed(2)})` : '';
    if (name && g) return `${name} ${g}`;
    if (name) return name;
    if (g) return g.slice(1, -1);
    return null;
  };
  const dirLink = (coord, label) => coord
    ? `<a href="https://www.google.com/maps/dir/?api=1&destination=${coord[0]},${coord[1]}" target="_blank" rel="noopener" style="color:var(--navy-mid)">${label}</a>`
    : label;
  const putinText = t.startCoord
    ? dirLink(t.startCoord, fmtLoc(t.inName, t.startCoord))
    : (fmtLoc(t.inName, t.startCoord) ?? 'No put-in info available');
  const takeoutText = t.endCoord
    ? dirLink(t.endCoord, fmtLoc(t.outName, t.endCoord))
    : fmtLoc(t.outName, t.endCoord);
  const paddleParts = [];
  if (t.hours !== null) paddleParts.push((t.type==='Whitewater'?'~':'') + fmtNum(t.hours) + ' hrs');
  if (t.miles !== null) paddleParts.push(fmtNum(t.miles) + ' mi');
  if (t.rapids) {

      ${showMapBtn}

      <div class="modal-row"><b>Drive:</b> ${t.driveLive ?? t.drive} min${t.driveLive != null ? ' (from your location)' : ''}</div>

// ─── HISTORICAL RUNNABILITY (USGS 10-yr daily values, cached 30 days) ────────
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
let HIST_DAILY = {};  // site → [[date, cfs], ...] most recent ~400 days

function applyHistStats(stats) {
  Object.entries(stats).forEach(([idx, pct]) => {
    if (TRIPS[idx]) TRIPS[idx].histPct = pct;
  });
}

async function fetchHistory() {
  // use cached stats if fresh (30 days)
  try {
    const c = JSON.parse(localStorage.getItem('nsp_hist_v18'));
    if (c?.stats && Date.now() - c.ts < 30 * 864e5) {
      applyHistStats(c.stats);
      HIST_DAILY = c.daily || {};
      console.log('[NSP] Historical stats loaded from cache');
      return;
    }
  } catch(e) {}

  const tripsWithTh = TRIPS.filter(t => t.usgs && t.below !== null);
  const ids = [...new Set(tripsWithTh.map(t => t.usgs))];
  if (!ids.length) return;

  const end = new Date();
  const start = new Date(end.getFullYear() - 10, end.getMonth(), 1);
  const fmt = d => d.toISOString().slice(0, 10);
  const url = 'https://waterservices.usgs.gov/nwis/dv/?format=json'
    + '&sites=' + ids.join(',')
    + '&parameterCd=00060&statCd=00003'
    + '&startDT=' + fmt(start) + '&endDT=' + fmt(end);

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    // bucket daily flows per site per month (+ keep recent daily series for lookups)
    const siteMonthly = {};
    const siteDaily = {};
    data.value?.timeSeries?.forEach(s => {
      const site = normId(s.sourceInfo.siteCode[0].value);
      if (!siteMonthly[site]) siteMonthly[site] = Array.from({length:12}, () => []);
      if (!siteDaily[site]) siteDaily[site] = [];
      (s.values[0]?.value || []).forEach(v => {
        const f = parseFloat(v.value);
        if (isNaN(f) || f < -999990) return;
        const m = parseInt(v.dateTime.slice(5, 7), 10) - 1;
        siteMonthly[site][m].push(f);
        siteDaily[site].push([v.dateTime.slice(0, 10), f]);
      });
    });
    // keep only the most recent ~400 days per site
    Object.keys(siteDaily).forEach(k => { siteDaily[k] = siteDaily[k].slice(-400); });
    HIST_DAILY = siteDaily;

    // per-trip: % of days per month within runnable band [below, high)
    const stats = {};
    tripsWithTh.forEach(t => {
      const buckets = siteMonthly[normId(t.usgs)];
      if (!buckets) return;
      const lo = parseFloat(t.below), hi = parseFloat(t.high);
      if (isNaN(lo) || isNaN(hi)) return;
      const pct = buckets.map(a => {
        if (!a.length) return null;
        return Math.round(100 * a.filter(f => f >= lo && f < hi).length / a.length);
      });
      stats[TRIPS.indexOf(t)] = pct;
    });

    applyHistStats(stats);
    try { localStorage.setItem('nsp_hist_v18', JSON.stringify({ ts: Date.now(), stats, daily: HIST_DAILY })); } catch(e) {}
    console.log('[NSP] Historical stats computed for', Object.keys(stats).length, 'trips');
  } catch(e) {
    console.warn('[NSP] Historical stats failed:', e.message);
  }
}

function histSummaryHtml(t) {
  if (!t.histPct) return '';
  const m = new Date().getMonth();
  const cur = t.histPct[m];
  if (cur === null || cur === undefined) return '';
  const greyLine = s => `<div class="modal-row" style="font-size:0.85rem;color:var(--subtext)">${s}</div>`;

  let rows = `<div class="modal-row"><b>Runnable this month:</b> ~${cur}% of ${MONTH_NAMES[m]} days</div>`;

  if (cur >= 33) {
    // current month already clears 33% — no extra line needed
  } else {
    // find the SOONEST upcoming month that clears 33% (cycling forward)
    let nextIdx = -1, nextPct = 0;
    for (let i = 1; i <= 11; i++) {
      const mi = (m + i) % 12;
      const p = t.histPct[mi];
      if (p !== null && p >= 33) { nextIdx = mi; nextPct = p; break; }
    }
    if (nextIdx >= 0) {
      rows += greyLine(`Next best window: ${MONTH_NAMES[nextIdx]} (~${nextPct}%)`);
    } else {
      // no month clears 33% — report the strongest month anyway
      let topIdx = -1, topPct = -1;
      t.histPct.forEach((p, i) => {
        if (p !== null && p > topPct) { topPct = p; topIdx = i; }
      });
      rows += `<div class="modal-row">This trip usually needs a rain event</div>`;
      if (topIdx >= 0) {
        rows += greyLine(`Best odds in ${MONTH_NAMES[topIdx]} (~${topPct}% of days)`);
      }
    }
  }
  return rows;
}

function histChartHtml(t) {
  if (!t.histPct) return '';
  const m = new Date().getMonth();
  const labels = ['J','F','M','A','M','J','J','A','S','O','N','D'];
  const w = 312, h = 64, barW = 20, gap = 6, chartH = 46;

  let bars = '';
  t.histPct.forEach((p, i) => {
    const x = i * (barW + gap);
    const pct = p ?? 0;
    const barH = Math.max(2, (pct / 100) * chartH);
    const y = chartH - barH;
    // color intensity scales with pct
    const green = pct >= 50 ? '#2e9e4f' : pct >= 25 ? '#7dba8e' : '#c5ddca';
    const isCur = i === m;
    bars += `<g>`
      + `<title>${MONTH_NAMES[i]}: ${p === null ? 'no data' : '~' + p + '%'}</title>`
      + `<rect x="${x}" y="${y}" width="${barW}" height="${barH}" rx="2" fill="${green}"`
      + (isCur ? ` stroke="#0d2c54" stroke-width="2"` : '')
      + `/>`
      + `<text x="${x + barW/2}" y="${h - 4}" text-anchor="middle" font-size="9" fill="${isCur ? '#0d2c54' : '#8a9aaa'}" font-weight="${isCur ? '700' : '400'}">${labels[i]}</text>`
      + `</g>`;
  });

  return `<div class="modal-row" style="margin-top:10px">
    <svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="max-width:100%">${bars}</svg>
  </div>`;
}


// ─── SHOW-IN-MAP MODAL (start/end/you + traced river path) ───────────────────
// Street and satellite base layers, shared by both maps
function addBaseLayers(map, defaultLayer) {
  const street = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
  });
  const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles © Esri — Source: Esri, Maxar, Earthstar Geographics'
  });
  (defaultLayer === 'satellite' ? satellite : street).addTo(map);
  L.control.layers({ 'Street': street, 'Satellite': satellite }, null, { position: 'topright' }).addTo(map);
}

function haversine(a, b) {
  const R = 3958.8;
  const [la1, lo1] = a.map(x => x * Math.PI / 180);
  const [la2, lo2] = b.map(x => x * Math.PI / 180);
  return 2 * R * Math.asin(Math.sqrt(
    Math.sin((la2 - la1) / 2) ** 2 + Math.cos(la1) * Math.cos(la2) * Math.sin((lo2 - lo1) / 2) ** 2
  ));
}

// Single attempt: fetch waterway geometry near start/end from OpenStreetMap
// (Overpass), build a graph of segment endpoints, and find the shortest path
// along the water from start to end. Returns an array of [lat,lng], or null.
async function attemptTrace(startCoord, endCoord, padMultiplier, endpoint) {
  const pad = Math.max(0.02, haversine(startCoord, endCoord) / 69 * padMultiplier);
  const south = Math.min(startCoord[0], endCoord[0]) - pad;
  const north = Math.max(startCoord[0], endCoord[0]) + pad;
  const west  = Math.min(startCoord[1], endCoord[1]) - pad;
  const east  = Math.max(startCoord[1], endCoord[1]) + pad;

  const query = `[out:json][timeout:25];way["waterway"](${south},${west},${north},${east});out geom;`;

  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 26000);
  let data;
  try {
    const res = await fetch(endpoint, {
      method: 'POST',
      body: 'data=' + encodeURIComponent(query),
      signal: ctl.signal
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    data = await res.json();
  } catch (e) {
    console.warn('[NSP] River trace fetch failed (' + endpoint + '):', e.message);
    return null;
  } finally {
    clearTimeout(timer);
  }

  const ways = (data.elements || []).filter(w => w.geometry && w.geometry.length > 1);
  if (!ways.length) return null;

  // Build a graph: snap nearby points (within ~15m) into shared nodes so
  // separately-drawn OSM segments connect where they actually meet.
  const SNAP = 0.00015; // ~15m in degrees at this latitude
  const buckets = new Map();
  const nodeKey = (lat, lon) => {
    const bk = Math.round(lat / SNAP) + ',' + Math.round(lon / SNAP);
    if (buckets.has(bk)) return buckets.get(bk);
    const key = lat.toFixed(6) + ',' + lon.toFixed(6);
    buckets.set(bk, key);
    return key;
  };

  const nodes = new Map(); // key -> [lat,lon]
  const adj = new Map();   // key -> [{to, dist}]
  const addEdge = (k1, p1, k2, p2) => {
    const d = haversine(p1, p2);
    if (!adj.has(k1)) adj.set(k1, []);
    if (!adj.has(k2)) adj.set(k2, []);
    adj.get(k1).push({ to: k2, dist: d });
    adj.get(k2).push({ to: k1, dist: d });
  };

  ways.forEach(w => {
    let prevKey = null, prevPt = null;
    w.geometry.forEach(pt => {
      const p = [pt.lat, pt.lon];
      const k = nodeKey(pt.lat, pt.lon);
      nodes.set(k, p);
      if (prevKey && prevKey !== k) addEdge(prevKey, prevPt, k, p);
      prevKey = k; prevPt = p;
    });
  });

  if (!nodes.size) return null;

  // nearest graph node to a given coordinate
  const nearest = (coord) => {
    let bestK = null, bestD = Infinity;
    nodes.forEach((p, k) => {
      const d = haversine(coord, p);
      if (d < bestD) { bestD = d; bestK = k; }
    });
    return { key: bestK, dist: bestD };
  };

  const startNode = nearest(startCoord);
  const endNode = nearest(endCoord);
  // if the nearest waterway point is implausibly far from either end, bail
  if (!startNode.key || !endNode.key || startNode.dist > 1.5 || endNode.dist > 1.5) return null;

  // Dijkstra (simple array-based selection; graphs here are small)
  const dist = new Map([[startNode.key, 0]]);
  const prev = new Map();
  const visited = new Set();
  const queueKeys = new Set([startNode.key]);

  while (queueKeys.size) {
    let uKey = null, uDist = Infinity;
    queueKeys.forEach(k => { const d = dist.get(k) ?? Infinity; if (d < uDist) { uDist = d; uKey = k; } });
    if (uKey === null) break;
    queueKeys.delete(uKey);
    if (uKey === endNode.key) break;
    visited.add(uKey);
    (adj.get(uKey) || []).forEach(({ to, dist: w }) => {
      if (visited.has(to)) return;
      const nd = uDist + w;
      if (nd < (dist.get(to) ?? Infinity)) {
        dist.set(to, nd);
        prev.set(to, uKey);
        queueKeys.add(to);
      }
    });
  }

  if (!dist.has(endNode.key)) return null;

  const pathKeys = [endNode.key];
  let cur = endNode.key;
  while (cur !== startNode.key) {
    cur = prev.get(cur);
    if (!cur) return null;
    pathKeys.push(cur);
  }
  pathKeys.reverse();
  return pathKeys.map(k => nodes.get(k));
}

// Public entry point: tries a normal-sized search first; if that finds no
// path (river winds outside the box, or the primary Overpass server is slow/
// down), retries once with a wider box on a second mirror before giving up.
async function traceRiverPath(startCoord, endCoord) {
  const attempts = [
    { pad: 0.5, endpoint: 'https://overpass-api.de/api/interpreter' },
    { pad: 0.9, endpoint: 'https://overpass.kumi.systems/api/interpreter' },
  ];
  for (const { pad, endpoint } of attempts) {
    const result = await attemptTrace(startCoord, endCoord, pad, endpoint);
    if (result && result.length > 1) return result;
  }
  return null;
}

async function openMapModal(idx) {
  const t = TRIPS[idx];
  if (!t || !t.startCoord) return;

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  overlay.innerHTML = `
    <div class="modal-box" style="max-width:480px">
      <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">×</button>
      <h3>${t.river}</h3>
      <div class="modal-trip">${t.trip}</div>
      <div class="modal-row"><b>Put-in:</b> ${t.inName ? t.inName + ' ' : ''}${t.startCoord ? `(${t.startCoord[0].toFixed(2)}, ${t.startCoord[1].toFixed(2)})` : ''}</div>
      ${(t.outName || t.endCoord) ? `<div class="modal-row"><b>Take-out:</b> ${t.outName ? t.outName + ' ' : ''}${t.endCoord ? `(${t.endCoord[0].toFixed(2)}, ${t.endCoord[1].toFixed(2)})` : ''}</div>` : ''}
      <div id="tripMiniMap" style="height:320px;border-radius:10px;margin-top:6px"></div>
      <div class="modal-row" id="mmStatus" style="font-size:0.78rem;color:var(--subtext);margin-top:6px">Tracing river path…</div>
    </div>`;
  document.body.appendChild(overlay);

  const map = L.map('tripMiniMap');
  addBaseLayers(map, 'satellite');

  const bounds = [t.startCoord];
  L.circleMarker(t.startCoord, { radius: 8, fillColor: '#2ecc71', color: '#1a9956', weight: 2, fillOpacity: 0.9 })
    .addTo(map).bindPopup('Put-in' + (t.inName ? ': ' + t.inName : ''));

  if (t.endCoord) {
    bounds.push(t.endCoord);
    L.circleMarker(t.endCoord, { radius: 8, fillColor: '#e74c3c', color: '#b03020', weight: 2, fillOpacity: 0.9 })
      .addTo(map).bindPopup('Take-out' + (t.outName ? ': ' + t.outName : ''));
  }

  const statusEl = document.getElementById('mmStatus');

  const addUserMarker = (lat, lng) => {
    bounds.push([lat, lng]);
    L.circleMarker([lat, lng], { radius: 9, fillColor: '#1e88e5', color: '#fff', weight: 3, fillOpacity: 1 })
      .addTo(map).bindPopup('You are here');
    map.fitBounds(L.latLngBounds(bounds), { padding: [30, 30] });
  };

  if (USER_LOCATION) {
    addUserMarker(USER_LOCATION.lat, USER_LOCATION.lng);
  } else if (navigator.geolocation) {
    // Permission was already asked for drive times; this reuses it silently —
    // if granted, the browser returns a position with no new prompt.
    navigator.geolocation.getCurrentPosition(
      pos => { USER_LOCATION = { lat: pos.coords.latitude, lng: pos.coords.longitude }; addUserMarker(USER_LOCATION.lat, USER_LOCATION.lng); },
      () => {},
      { enableHighAccuracy: false, timeout: 5000, maximumAge: 10 * 60 * 1000 }
    );
  }

  map.fitBounds(bounds.length > 1 ? L.latLngBounds(bounds) : L.latLngBounds([t.startCoord, t.startCoord]), { padding: [30, 30] });
  if (bounds.length === 1) map.setView(t.startCoord, 13);

  if (!t.endCoord) {
    if (statusEl) statusEl.remove();
    return;
  }

  // river path: use cache if this trip's been traced before this session
  let path = RIVER_PATH_CACHE[idx];
  if (path === undefined) {
    path = await traceRiverPath(t.startCoord, t.endCoord);
    RIVER_PATH_CACHE[idx] = path;
  }

  // modal may have been closed while we were fetching
  if (!document.getElementById('tripMiniMap')) return;

  if (path && path.length > 1) {
    L.polyline(path, { color: '#1e4fa1', weight: 4, opacity: 0.85 }).addTo(map);
    if (statusEl) statusEl.remove();
  } else {
    L.polyline([t.startCoord, t.endCoord], { color: '#1e4fa1', weight: 3, opacity: 0.5, dashArray: '6,8' }).addTo(map);
    if (statusEl) statusEl.textContent = 'River path unavailable — showing straight line';
  }
}

// ─── RAIN FORECAST (National Weather Service — free, no key) ─────────────────
let FORECAST_URL = null;
let FORECAST_PERIODS = null;
let QPF_BY_DAY = {};

async function fetchRain() {
  try {
    // center of trip area
    const pt = await (await fetch('https://api.weather.gov/points/43.15,-88.05')).json();
    const gridUrl = pt.properties?.forecastGridData;
    FORECAST_URL = pt.properties?.forecast || null;
    if (!gridUrl) throw new Error('no grid URL');
    const grid = await (await fetch(gridUrl)).json();
    const qpf = grid.properties?.quantitativePrecipitation?.values || [];

    // sum precipitation (mm) for periods starting within next 24h
    const now = Date.now();
    const cutoff = now + 24 * 3600 * 1000;
    let totalMm = 0;
    qpf.forEach(v => {
      const start = new Date(v.validTime.split('/')[0]).getTime();
      if (start >= now - 3600e3 && start < cutoff && v.value) totalMm += v.value;
    });

    // per-day rainfall totals for the 7-day modal
    QPF_BY_DAY = {};
    qpf.forEach(v => {
      const day = v.validTime.split('/')[0].slice(0, 10);
      if (v.value) QPF_BY_DAY[day] = (QPF_BY_DAY[day] || 0) + v.value;
    });

    const inches = totalMm / 25.4;
    const badge = document.getElementById('rainBadge');
    badge.style.display = 'flex';
    badge.style.cursor = 'pointer';
    badge.title = 'Click for 7-day forecast';
    badge.onclick = openForecastModal;
    badge.innerHTML = inches >= 0.01
      ? `${inches.toFixed(2)}" rain next 24hr`
      : `No rain next 24hr`;
  } catch(e) {
    console.warn('[NSP] Rain forecast failed:', e.message);
  }
}

function capFirst(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1).toLowerCase() : s; }
async function openForecastModal() {
  if (!FORECAST_URL) return;
  try {
    if (!FORECAST_PERIODS) {
      const fc = await (await fetch(FORECAST_URL)).json();
      FORECAST_PERIODS = fc.properties?.periods || [];
    }
    // merge day/night periods into one row per calendar day
    const byDay = new Map();
    FORECAST_PERIODS.forEach(p => {
      const key = p.startTime.slice(0, 10);
      if (!byDay.has(key)) byDay.set(key, { date: key, name: null, hi: null, lo: null, pop: null, text: null, nightName: null, nightText: null });
      const d = byDay.get(key);
      const pop = p.probabilityOfPrecipitation?.value;
      if (pop != null) d.pop = Math.max(d.pop ?? 0, pop);
      if (p.isDaytime) {
        d.name = p.name; d.hi = p.temperature; d.text = p.shortForecast;
      } else {
        d.nightName = p.name; d.lo = p.temperature; d.nightText = p.shortForecast;
      }
    });
    const rows = [...byDay.values()].slice(0, 7).map(d => {
      const name = d.name ?? d.nightName;
      const temp = (d.hi !== null && d.lo !== null) ? `${d.hi}° / ${d.lo}°`
                 : (d.hi !== null ? `${d.hi}°` : `${d.lo}°`);
      const popText = (d.pop != null && d.pop > 0) ? `<span style="color:var(--navy-mid);font-weight:600">${d.pop}%</span>` : '<span style="color:var(--subtext)">—</span>';
      const mm = QPF_BY_DAY[d.date] || 0;
      const inch = mm / 25.4;
      const inchText = inch >= 0.01 ? `<span style="color:var(--navy-mid);font-weight:600">${inch.toFixed(2)}"</span>` : '<span style="color:var(--subtext)">—</span>';
      return `<div class="fc-row">
        <div class="fc-day">${name}</div>
        <div class="fc-temp">${temp}</div>
        <div class="fc-pop">${popText}</div>
        <div class="fc-amt">${inchText}</div>
        <div class="fc-text">${capFirst(d.text ?? d.nightText)}</div>
      </div>`;
    }).join('');

    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
    overlay.innerHTML = `
      <div class="modal-box fc-box">
        <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">×</button>
        <h3>7-Day Forecast</h3>
        <div class="modal-trip">Greater Milwaukee area</div>
        <div class="fc-row fc-head">
          <div class="fc-day">Day</div><div class="fc-temp">High / Low</div><div class="fc-pop">Rain</div><div class="fc-amt">Amount</div><div class="fc-text">Forecast</div>
        </div>
        ${rows}
      </div>`;
    document.body.appendChild(overlay);
  } catch(e) {
    console.warn('[NSP] Forecast detail failed:', e.message);
  }
}

// ─── LIVE DRIVE TIMES (browser geolocation + OSRM routing, free/no key) ──────
let USER_LOCATION = null;
const RIVER_PATH_CACHE = {}; // tripIndex -> array of [lat,lng] or null (tried, unavailable)

function fetchDriveTimes() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(async pos => {
    try {
      const { latitude: lat, longitude: lng } = pos.coords;
      USER_LOCATION = { lat, lng };
      showUserOnMap(lat, lng);
      const dests = TRIPS.filter(t => t.startCoord);
      // OSRM expects lng,lat — user location first (index 0)
      const coords = [`${lng},${lat}`]
        .concat(dests.map(t => `${t.startCoord[1]},${t.startCoord[0]}`))
        .join(';');
      const url = `https://router.project-osrm.org/table/v1/driving/${coords}?sources=0&annotations=duration`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const durations = data.durations?.[0];
      if (!durations) throw new Error('no durations');
      dests.forEach((t, i) => {
        const sec = durations[i + 1]; // index 0 is user→user
        if (sec != null) t.driveLive = Math.round(sec / 60);
      });
      console.log('[NSP] Live drive times loaded for', dests.length, 'trips');
      getTypes().forEach(type => renderTable(type));
    } catch(e) {
      console.warn('[NSP] Drive time fetch failed:', e.message);
    }
  }, err => {
    console.log('[NSP] Geolocation unavailable/denied — using spreadsheet drive times');
  }, { enableHighAccuracy: false, timeout: 10000, maximumAge: 10 * 60 * 1000 });
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
// Native <select> elements often size themselves to their widest OPTION
// rather than the currently selected one (a long-standing cross-browser
// quirk). This measures the actual selected text and sets an exact width
// so the control visibly shrinks/grows with the current selection.
function sizeSelectToContent(sel) {
  const canvas = sizeSelectToContent._canvas || (sizeSelectToContent._canvas = document.createElement('canvas'));
  const ctx = canvas.getContext('2d');
  const cs = getComputedStyle(sel);
  ctx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  const text = sel.options[sel.selectedIndex]?.text || '';
  const textWidth = ctx.measureText(text).width;
  const extra = 48; // left+right padding plus room for the native dropdown arrow
  sel.style.width = Math.ceil(textWidth + extra) + 'px';
}

window.addEventListener('load', () => {
  renderAll();
  initMap();
  fetchUSGS();
  fetchRain();
  fetchDriveTimes();
  setTimeout(fetchHistory, 3000);
  ['fltDrive', 'fltHours', 'fltStars'].forEach(id => {
    const el = document.getElementById(id);
    if (el) sizeSelectToContent(el);
  });
  // auto-refresh live data every 15 minutes
  setInterval(() => { fetchUSGS(); fetchRain(); }, 15 * 60 * 1000);
});
